<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fit Buddies</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
@keyframes dance{0%{transform:rotate(0)}25%{transform:rotate(-15deg) scale(1.2)}50%{transform:rotate(15deg) scale(1.3)}75%{transform:rotate(-10deg) scale(1.2)}100%{transform:rotate(0)}}
.dancer{animation:dance .6s ease-in-out 3;font-size:60px;display:inline-block}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  (async()=>{try{const raw=localStorage.getItem("fitness-buddies-v1");if(!raw||localStorage.getItem("fb-migrated"))return;const old=JSON.parse(raw);for(const day in old){for(const uid in old[day]){const v=old[day][uid];if(v===true||(v&&v.done)){await fetch("https://fit-buddies-c2d65-default-rtdb.europe-west1.firebasedatabase.app/checkData/"+day+"/"+uid+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({done:true,workout:(v&&v.workout)||""})});}}}localStorage.setItem("fb-migrated","1");}catch(e){}})();
const {useState,useEffect}=React;
const FB="https://fit-buddies-c2d65-default-rtdb.europe-west1.firebasedatabase.app";
const TG="8864998845:AAHxHXLpm0VRXaM6gCNLoN21LGe8zmPAcIc";
const U=[
{id:"madalina",name:"Madalina",emoji:"❤️",color:"#C084FC",light:"#F3E8FF",dark:"#3B1F5E",chat:"1544444861"},
{id:"gabriela",name:"Gabriela",emoji:"🤍",color:"#FB923C",light:"#FFF7ED",dark:"#3D1F0A",chat:"5484205376"}];
const WK=["Full Body","Upper Body","Lower Body","Core"];
const DOW=["L","M","M","J","V","S","D"];
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ds(new Date());
function cellsFor(y,m){const t=new Date();t.setHours(0,0,0,0);const n=new Date(y,m+1,0).getDate();const f=(new Date(y,m,1).getDay()+6)%7;const c=[];for(let i=0;i<f;i++)c.push(null);for(let d=1;d<=n;d++){const dt=new Date(y,m,d);c.push({day:d,key:ds(dt),fut:dt>t,tod:dt.getTime()===t.getTime()});}return c;}
async function tg(chat,text){try{const r=await fetch("https://api.telegram.org/bot"+TG+"/sendMessage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:chat,text,parse_mode:"HTML"})});return r.ok;}catch(e){return false;}}
async function rd(){try{const r=await fetch(FB+"/checkData.json");return r.ok?await r.json():null;}catch(e){return null;}}
async function wr(key,uid,val){try{await fetch(FB+"/checkData/"+key+"/"+uid+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(val)});}catch(e){}}
function streak(D,u){let s=0;const d=new Date();if(!D[ds(d)]?.[u]?.done)d.setDate(d.getDate()-1);while(D[ds(d)]?.[u]?.done){s++;d.setDate(d.getDate()-1);}return s;}
function monthStats(D,u,y,m){const c={};let tot=0;Object.keys(D).forEach(k=>{const [yy,mm]=k.split("-").map(Number);if(yy===y&&mm===m+1&&D[k]?.[u]?.done){tot++;const w=D[k][u].workout||"Nespecificat";c[w]=(c[w]||0)+1;}});return {tot,c};}
function App(){
const [me,setMe]=useState(()=>localStorage.getItem("fb-me"));
const [D,setD]=useState({});
const [toast,setToast]=useState(null);
const [pick,setPick]=useState(false);
const [other,setOther]=useState("");
const [party,setParty]=useState(false);
const n0=new Date();
const [vy,setVy]=useState(n0.getFullYear());
const [vm,setVm]=useState(n0.getMonth());
const [det,setDet]=useState(null);
const [dk,setDk]=useState(window.matchMedia("(prefers-color-scheme: dark)").matches);
useEffect(()=>{const load=()=>rd().then(d=>setD(d||{}));load();const i=setInterval(load,15000);return()=>clearInterval(i);},[]);
const T=today();
const user=U.find(u=>u.id===me);
const done=me&&D[T]?.[me]?.done;
const say=m=>{setToast(m);setTimeout(()=>setToast(null),3500);};
async function check(w){
const nd={...D,[T]:{...(D[T]||{}),[me]:done?null:{done:true,workout:w||""}}};
setD(nd);setPick(false);setOther("");
await wr(T,me,done?null:{done:true,workout:w||""});
if(done){say("↩️ Zi debifată");return;}
setParty(true);setTimeout(()=>setParty(false),2200);
const o=U.find(u=>u.id!==me);
const ok=await tg(o.chat,user.emoji+" <b>"+user.name+"</b> a bifat sportul azi"+(w?" ("+w+")":"")+"! 💪\nHai că poți și tu! 🔥");
say(ok?"✅ "+o.name+" a primit notificare":"✅ Sport bifat!");}
const bg=dk?"#0F0F0F":"#F9FAFB",card=dk?"#1C1C1E":"#fff",tx=dk?"#F9FAFB":"#111827",sub=dk?"#9CA3AF":"#6B7280",bd=dk?"#2C2C2E":"#E5E7EB",empty=dk?"#1C1C1E":"#F3F4F6";
const isCur=vy===n0.getFullYear()&&vm===n0.getMonth();
const go=s=>{const d=new Date(vy,vm+s,1);setVy(d.getFullYear());setVm(d.getMonth());};
const label=new Date(vy,vm,1).toLocaleString("ro-RO",{month:"long",year:"numeric"});
const st=me?streak(D,me):0;
const ms=me?monthStats(D,me,vy,vm):{tot:0,c:{}};
const lbl={fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:".08em",color:sub,marginBottom:10};
const wrap={maxWidth:480,margin:"0 auto",padding:"18px 20px 0"};
const chip={padding:"8px 14px",borderRadius:20,border:"1.5px solid "+(user?user.color:bd),background:"transparent",color:tx,fontSize:13,fontWeight:600,fontFamily:"inherit"};
return(<div style={{minHeight:"100vh",background:bg,fontFamily:"system-ui",paddingBottom:80}}>
{party&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:200,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}><div className="dancer">💃</div><div style={{color:"#fff",fontSize:24,fontWeight:700,textAlign:"center"}}>Bravo! 🔥</div></div>}
<div style={{background:card,borderBottom:"1px solid "+bd,position:"sticky",top:0,zIndex:10}}><div style={{maxWidth:480,margin:"0 auto",padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
<b style={{fontSize:18,color:tx}}>🏃‍♀️ Fit Buddies</b>
<button onClick={()=>setDk(!dk)} style={{background:"none",border:"1px solid "+bd,borderRadius:20,padding:"4px 10px",fontSize:16}}>{dk?"☀️":"🌙"}</button></div></div>
{!me&&<div style={wrap}><p style={lbl}>Cine ești?</p><div style={{display:"flex",gap:12}}>
{U.map(u=><button key={u.id} onClick={()=>{setMe(u.id);localStorage.setItem("fb-me",u.id);}} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6,padding:"16px 12px",borderRadius:16,fontFamily:"inherit",background:card,color:tx,border:"2px solid "+u.color}}>
<span style={{fontSize:28}}>{u.emoji}</span><b>{u.name}</b></button>)}
</div></div>}
{user&&<div style={wrap}><div style={{borderRadius:20,padding:20,border:"2px solid "+user.color,background:dk?user.dark:user.light,display:"flex",flexDirection:"column",gap:14}}>
<div style={{color:tx}}><b style={{fontSize:18}}>{user.emoji} {user.name}</b>
<div style={{fontSize:13,color:sub,marginTop:4}}>🔥 {st} zile la rând · 📅 {ms.tot} luna asta</div>
{st>=2&&<div style={{fontSize:Math.min(16+st*3,40),marginTop:6}}>{"🔥".repeat(Math.min(st,7))}</div>}</div>
{done&&D[T][me].workout&&<div style={{fontSize:14,color:tx}}>💪 {D[T][me].workout}</div>}
{pick&&!done&&<div style={{display:"flex",flexDirection:"column",gap:8}}>
<div style={{display:"flex",flexWrap:"wrap",gap:8}}>{WK.map(w=><button key={w} onClick={()=>check(w)} style={chip}>{w}</button>)}</div>
<div style={{display:"flex",gap:8}}><input value={other} onChange={e=>setOther(e.target.value)} placeholder="Altceva..." style={{...chip,flex:1,background:card,outline:"none"}}/>
{other&&<button onClick={()=>check(other)} style={{...chip,background:user.color,color:"#fff"}}>✓</button>}</div></div>}
{!pick&&<button onClick={()=>done?check(null):setPick(true)} style={{padding:"14px 0",borderRadius:14,border:"none",color:"#fff",fontSize:16,fontWeight:700,fontFamily:"inherit",background:done?"#6B7280":user.color}}>{done?"✓ Bifat azi — anulează":"✅ Am făcut sport azi!"}</button>}
</div></div>}
{user&&ms.tot>0&&<div style={wrap}><p style={lbl}>Statistici {label}</p><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
{Object.entries(ms.c).map(([w,c])=><div key={w} style={{background:card,border:"1px solid "+bd,borderRadius:12,padding:"8px 14px",fontSize:13,color:tx}}><b style={{color:user.color}}>{c}x</b> {w}</div>)}</div></div>}
<div style={wrap}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
<button onClick={()=>go(-1)} style={{background:"none",border:"1px solid "+bd,borderRadius:10,padding:"6px 14px",fontSize:20,color:tx}}>‹</button>
<b style={{fontSize:14,color:tx,textTransform:"capitalize"}}>{label}</b>
<button onClick={()=>!isCur&&go(1)} style={{background:"none",border:"1px solid "+bd,borderRadius:10,padding:"6px 14px",fontSize:20,color:tx,opacity:isCur?.2:1}}>›</button></div>
<div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:4}}>{DOW.map((d,i)=><div key={i} style={{textAlign:"center",fontSize:11,fontWeight:600,color:sub}}>{d}</div>)}</div>
<div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
{cellsFor(vy,vm).map((c,i)=>{if(!c)return <div key={i}/>;const m=D[c.key]||{};const a=m.madalina?.done,b=m.gabriela?.done;
const back=c.fut?bg:a&&b?"linear-gradient(135deg,#C084FC,#FB923C)":a?U[0].color:b?U[1].color:empty;
return <div key={c.key} onClick={()=>(a||b)&&setDet({key:c.key,m})} style={{aspectRatio:"1",borderRadius:10,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:back,border:c.tod?"2px solid #6366F1":"2px solid transparent",color:(a||b)?"#fff":c.fut?"#9CA3AF":tx}}>
<span style={{fontSize:11,fontWeight:600}}>{c.day}</span><span style={{fontSize:8}}>{a&&b?"🤝":a?U[0].emoji:b?U[1].emoji:""}</span></div>;})}
</div>
<div style={{display:"flex",gap:16,marginTop:12,fontSize:12,color:sub}}><span>❤️ Madalina</span><span>🤍 Gabriela</span><span>🤝 Amândouă</span></div></div>
{det&&<div onClick={()=>setDet(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
<div onClick={e=>e.stopPropagation()} style={{background:card,borderRadius:"20px 20px 0 0",padding:24,width:"100%",maxWidth:480,color:tx}}>
<b>📅 {det.key}</b>
{U.map(u=><div key={u.id} style={{marginTop:14}}>{u.emoji} <b>{u.name}</b>: <span style={{color:sub}}>{det.m[u.id]?.done?"✅ "+(det.m[u.id].workout||"sport"):"—"}</span></div>)}
<button onClick={()=>setDet(null)} style={{width:"100%",marginTop:20,padding:12,borderRadius:12,border:"none",background:empty,color:tx,fontSize:15,fontWeight:600}}>Închide</button></div></div>}
{toast&&<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#1F2937",color:"#fff",padding:"12px 24px",borderRadius:40,fontSize:14,fontWeight:600,zIndex:300,whiteSpace:"nowrap"}}>{toast}</div>}
</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
(function(){
var DB="https://fit-buddies-c2d65-default-rtdb.europe-west1.firebasedatabase.app/checkData";
var W=["Full Body","Upper Body","Lower Body","Core"];
function ds(x){return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
var S="padding:10px;border-radius:12px;border:1px solid #ccc;font-size:15px;width:100%;box-sizing:border-box;font-family:inherit";
var b=document.createElement("button");b.textContent="📅";
b.style.cssText="position:fixed;right:16px;bottom:90px;z-index:90;width:52px;height:52px;border-radius:50%;border:none;background:#111827;color:#fff;font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.3)";
document.body.appendChild(b);
b.onclick=async function(){
var data=await fetch(DB+".json").then(function(r){return r.json()}).catch(function(){return null})||{};
var ids={};for(var d in data)for(var u in data[d])ids[u]=1;ids=Object.keys(ids);
var me=ids[0];try{for(var i=0;i<localStorage.length;i++){var v=localStorage.getItem(localStorage.key(i));if(ids.indexOf(v)>-1)me=v;}}catch(e){}
var y=new Date();y.setDate(y.getDate()-1);var sel="";
var ov=document.createElement("div");
ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px";
var bx=document.createElement("div");
bx.style.cssText="background:#fff;color:#111;border-radius:18px;padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;font-family:inherit";
bx.innerHTML='<b style="font-size:17px">Adaugă antrenament în trecut</b>'+
'<input id="pd" type="date" max="'+ds(new Date())+'" value="'+ds(y)+'" style="'+S+'">'+
'<select id="pu" style="'+S+'">'+ids.map(function(i){return '<option value="'+i+'"'+(i===me?" selected":"")+'>'+i.charAt(0).toUpperCase()+i.slice(1)+'</option>'}).join("")+'</select>'+
'<div id="pw" style="display:flex;flex-wrap:wrap;gap:8px">'+W.map(function(w){return '<button data-w="'+w+'" style="padding:8px 14px;border-radius:20px;border:1.5px solid #111;background:#fff;color:#111;font-size:13px;font-weight:600">'+w+'</button>'}).join("")+'</div>'+
'<input id="pc" placeholder="Altceva..." style="'+S+'">'+
'<button id="ps" style="padding:12px;border-radius:12px;border:none;background:#111827;color:#fff;font-size:15px;font-weight:600">Salvează</button>'+
'<button id="px" style="padding:10px;border-radius:12px;border:none;background:#FEE2E2;color:#B91C1C;font-size:14px">Șterge bifa din ziua aleasă</button>'+
'<button id="pn" style="padding:10px;border-radius:12px;border:none;background:#F3F4F6;color:#111;font-size:14px">Închide</button>';
ov.appendChild(bx);document.body.appendChild(ov);
var q=function(s){return bx.querySelector(s)};
bx.querySelectorAll("[data-w]").forEach(function(x){x.onclick=function(){sel=x.dataset.w;q("#pc").value="";bx.querySelectorAll("[data-w]").forEach(function(z){z.style.background=z===x?"#111827":"#fff";z.style.color=z===x?"#fff":"#111"})}});
q("#pn").onclick=function(){ov.remove()};
var url=function(){return DB+"/"+q("#pd").value+"/"+q("#pu").value+".json"};
q("#ps").onclick=async function(){var w=q("#pc").value.trim()||sel;if(!q("#pd").value)return;
await fetch(url(),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({done:true,workout:w})});location.reload()};
q("#px").onclick=async function(){await fetch(url(),{method:"DELETE"});location.reload()};
};
})();
</script>

</body>
</html>
