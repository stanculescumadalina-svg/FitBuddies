<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fit Buddies 🏃‍♀️</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>* { box-sizing: border-box; margin: 0; padding: 0; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback } = React;
    const CONFIG = {
      users: [
        { id: "madalina", name: "Madalina", emoji: "🌸", color: "#C084FC", lightColor: "#F3E8FF", telegram_chat_id: "1544444861" },
        { id: "gabriela", name: "Gabriela", emoji: "⚡", color: "#FB923C", lightColor: "#FFF7ED", telegram_chat_id: "5484205376" },
      ],
      telegram_bot_token: "8864998845:AAHxHXLpm0VRXaM6gCNLoN21LGe8zmPAcIc",
    };
    const STORAGE_KEY = "fitness-buddies-v1";
    function getToday() { return new Date().toISOString().slice(0, 10); }
    function getMonthDays() {
      const now = new Date(), year = now.getFullYear(), month = now.getMonth(), todayNum = now.getDate();
      const total = new Date(year, month + 1, 0).getDate(), days = [];
      for (let d = 1; d <= total; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        days.push({ day: d, dateStr, isFuture: d > todayNum, isToday: d === todayNum });
      }
      return days;
    }
    function loadData() { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : {}; } catch { return {}; } }
    function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
    async function sendTelegram(token, chatId, text) {
      try {
        const r = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({chat_id: chatId, text, parse_mode:"HTML"}) });
        return r.ok;
      } catch { return false; }
    }
    function getStreak(data, uid) {
      const now = new Date(); let s = 0;
      for (let i = 0; i < 60; i++) { const d = new Date(now); d.setDate(d.getDate()-i); if (data[d.toISOString().slice(0,10)]?.[uid]) s++; else break; }
      return s;
    }
    function getTotal(data, uid) { return Object.values(data).filter(v => v[uid]).length; }

    function App() {
      const [activeUser, setActiveUser] = useState(null);
      const [checkData, setCheckData] = useState(loadData);
      const [toast, setToast] = useState(null);
      const [sending, setSending] = useState(false);
      const TODAY = getToday();
      const days = getMonthDays();
      const monthLabel = new Date().toLocaleString("ro-RO", { month:"long", year:"numeric" });
      const showToast = (msg, type="success") => { setToast({msg,type}); setTimeout(()=>setToast(null),3500); };
      const handleCheck = useCallback(async () => {
        if (!activeUser) return;
        const user = CONFIG.users.find(u => u.id === activeUser);
        const already = checkData[TODAY]?.[activeUser];
        const updated = { ...checkData, [TODAY]: { ...(checkData[TODAY]||{}), [activeUser]: !already } };
        setCheckData(updated); saveData(updated);
        if (!already) {
          const other = CONFIG.users.find(u => u.id !== activeUser);
          setSending(true);
          const ok = await sendTelegram(CONFIG.telegram_bot_token, other.telegram_chat_id, `${user.emoji} <b>${user.name}</b> a bifat sportul azi! 💪\nHai că poți și tu! 🔥`);
          setSending(false);
          showToast(ok ? `✅ Sport bifat! ${other.name} a primit notificare pe Telegram.` : "✅ Sport bifat! (eroare Telegram)", ok ? "success" : "warning");
        } else { showToast("↩️ Zi debifată."); }
      }, [activeUser, checkData, TODAY]);
      const user = CONFIG.users.find(u => u.id === activeUser);
      const todayChecked = activeUser ? !!checkData[TODAY]?.[activeUser] : false;
      return (
        <div style={{minHeight:"100vh",background:"#F9FAFB",fontFamily:"system-ui",paddingBottom:60}}>
          <header style={{background:"#fff",borderBottom:"1px solid #E5E7EB",position:"sticky",top:0,zIndex:10}}>
            <div style={{maxWidth:480,margin:"0 auto",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <span style={{fontWeight:700,fontSize:18,color:"#111827"}}>🏃 Fit Buddies</span>
              <span style={{background:"#F3F4F6",borderRadius:20,padding:"4px 12px",fontSize:13,color:"#6B7280",textTransform:"capitalize"}}>{monthLabel}</span>
            </div>
          </header>
          <div style={{maxWidth:480,margin:"0 auto",padding:"24px 20px 0"}}>
            <p style={{fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.08em",color:"#9CA3AF",marginBottom:12}}>Cine ești azi?</p>
            <div style={{display:"flex",gap:12}}>
              {CONFIG.users.map(u => (
                <button key={u.id} onClick={()=>setActiveUser(u.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6,padding:"16px 12px",borderRadius:16,cursor:"pointer",fontFamily:"inherit",background:activeUser===u.id?u.color:"#fff",color:activeUser===u.id?"#fff":"#374151",border:`2px solid ${u.color}`,boxShadow:activeUser===u.id?`0 4px 20px ${u.color}55`:"none"}}>
                  <span style={{fontSize:28}}>{u.emoji}</span>
                  <span style={{fontWeight:600,fontSize:15}}>{u.name}</span>
                  {checkData[TODAY]?.[u.id] && <span style={{background:"rgba(255,255,255,0.25)",borderRadius:10,padding:"2px 8px",fontSize:11,fontWeight:600}}>✓ azi</span>}
                </button>
              ))}
            </div>
          </div>
          {activeUser && user && (
            <div style={{maxWidth:480,margin:"0 auto",padding:"20px 20px 0"}}>
              <div style={{borderRadius:20,padding:20,border:`2px solid ${user.color}`,background:user.lightColor,display:"flex",flexDirection:"column",gap:16}}>
                <div style={{display:"flex",alignItems:"center",gap:14}}>
                  <span style={{fontSize:36}}>{user.emoji}</span>
                  <div>
                    <div style={{fontWeight:700,fontSize:18,color:"#111827"}}>{user.name}</div>
                    <div style={{fontSize:13,color:"#6B7280",marginTop:2}}>🔥 {getStreak(checkData,activeUser)} zile la rând · 📅 {getTotal(checkData,activeUser)} total</div>
                  </div>
                </div>
                <button onClick={handleCheck} disabled={sending} style={{width:"100%",padding:"14px 0",borderRadius:14,border:"none",color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer",fontFamily:"inherit",background:todayChecked?"#6B7280":user.color,opacity:sending?0.7:1}}>
                  {sending?"Se trimite...":todayChecked?"✓ Bifat azi — anulează":"✅ Am făcut sport azi!"}
                </button>
              </div>
            </div>
          )}
          <div style={{maxWidth:480,margin:"0 auto",padding:"24px 20px 0"}}>
            <p style={{fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.08em",color:"#9CA3AF",marginBottom:12}}>Calendarul lunii</p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6}}>
              {days.map(({day,dateStr,isFuture,isToday}) => {
                const m = checkData[dateStr]||{};
                const bothDone = CONFIG.users.every(u=>m[u.id]);
                const oneDone = CONFIG.users.some(u=>m[u.id]);
                const bg = isFuture?"#F9FAFB":oneDone?(bothDone?"linear-gradient(135deg,#C084FC,#FB923C)":m["madalina"]?CONFIG.users[0].color:CONFIG.users[1].color):"#F3F4F6";
                const col = oneDone&&!isFuture?"#fff":isFuture?"#D1D5DB":"#374151";
                return (
                  <div key={dateStr} style={{aspectRatio:"1",borderRadius:10,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:bg,border:isToday?"2px solid #1F2937":"2px solid transparent",color:col}}>
                    <span style={{fontSize:12,fontWeight:600}}>{day}</span>
                    {bothDone&&<span style={{fontSize:9}}>🤝</span>}
                    {oneDone&&!bothDone&&<span style={{fontSize:9}}>{m["madalina"]?CONFIG.users[0].emoji:CONFIG.users[1].emoji}</span>}
                  </div>
                );
              })}
            </div>
            <div style={{display:"flex",gap:16,marginTop:14,flexWrap:"wrap"}}>
              {CONFIG.users.map(u=>(
                <div key={u.id} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#6B7280"}}>
                  <div style={{width:10,height:10,borderRadius:"50%",background:u.color}}/><span>{u.name}</span>
                </div>
              ))}
              <div style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#6B7280"}}>
                <div style={{width:10,height:10,borderRadius:"50%",background:"linear-gradient(135deg,#C084FC,#FB923C)"}}/><span>Amândouă 🤝</span>
              </div>
            </div>
          </div>
          {toast&&<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",color:"#fff",padding:"12px 24px",borderRadius:40,fontSize:14,fontWeight:600,zIndex:100,whiteSpace:"nowrap",boxShadow:"0 8px 24px rgba(0,0,0,0.2)",background:toast.type==="warning"?"#F59E0B":"#1F2937"}}>{toast.msg}</div>}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
