<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fit Buddies 🏃‍♀️</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @keyframes dance {
      0%{transform:rotate(0deg) scale(1)}
      25%{transform:rotate(-15deg) scale(1.2)}
      50%{transform:rotate(15deg) scale(1.3)}
      75%{transform:rotate(-10deg) scale(1.2)}
      100%{transform:rotate(0deg) scale(1)}
    }
    .dancer { animation: dance 0.6s ease-in-out 3; font-size: 60px; display:inline-block; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const FIREBASE_URL = "https://fit-buddies-c2d65-default-rtdb.europe-west1.firebasedatabase.app";
    const CONFIG = {
      users: [
        { id: "madalina", name: "Madalina", emoji: "❤️", color: "#C084FC", lightColor: "#F3E8FF", darkColor: "#3B1F5E", telegram_chat_id: "1544444861" },
        { id: "gabriela", name: "Gabriela", emoji: "🤍", color: "#FB923C", lightColor: "#FFF7ED", darkColor: "#3D1F0A", telegram_chat_id: "5484205376" },
      ],
      telegram_bot_token: "8864998845:AAHxHXLpm0VRXaM6gCNLoN21LGe8zmPAcIc",
    };
    const WORKOUTS = ["Full Body", "Upper Body", "Lower Body", "Core"];
    const DOW = ["L","M","M","J","V","S","D"];
    function getToday() { return new Date().toISOString().slice(0,10); }
    function getMonthDays(year, month) {
      const todayD = new Date();
      const total = new Date(year, month+1, 0).getDate();
      let firstDow = (new Date(year, month, 1).getDay()+6)%7;
      const cells = [];
      for (let i=0;i<firstDow;i++) cells.push(null);
      for (let d=1;d<=total;d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const isToday = d===todayD.getDate()&&year===todayD.getFullYear()&&month===todayD.getMonth();
        const isFuture = new Date(dateStr) > todayD && !isToday;
        cells.push({day:d,dateStr,isFuture,isToday});
      }
      return cells;
    }
    async function sendTelegram(token,chatId,text) {
      try { const r=await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:chatId,text,parse_mode:"HTML"})}); return r.ok; } catch{return false;}
    }
    async function fbRead(path) { try{const r=await fetch(`${FIREBASE_URL}/${path}.json`);return r.ok?await r.json():null;}catch{return null;} }
    async function fbWrite(path,data) { try{const r=await fetch(`${FIREBASE_URL}/${path}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});return r.ok;}catch{return false;} }
    function getStreak(data,uid) { const now=new Date();let s=0;for(let i=0;i<60;i++){const d=new Date(now);d.setDate(d.getDate()-i);if(data[d.toISOString().slice(0,10)]?.[uid]?.done)s++;else break;}return s; }
    function getTotal(data,uid) { return Object.values(data).filter(v=>v[uid]?.done).length; }
    function getStats(data,uid) { const c={};Object.values(data).forEach(v=>{const w=v[uid]?.workout;if(w)c[w]=(c[w]||0)+1;});return c; }

    function App() {
      const [activeUser,setActiveUser]=useState(null);
      const [checkData,setCheckData]=useState({});
      const [toast,setToast]=useState(null);
      const [sending,setSending]=useState(false);
      const [loading,setLoading]=useState(true);
      const [showWorkout,setShowWorkout]=useState(false);
      const [customWorkout,setCustomWorkout]=useState("");
      const [celebrating,setCelebrating]=useState(false);
      const [viewDate,setViewDate]=useState(()=>{const n=new Date();return{year:n.getFullYear(),month:n.getMonth()};});
      const [dayDetail,setDayDetail]=useState(null);
      const [isDark,setIsDark]=useState(()=>window.matchMedia('(prefers-color-scheme: dark)').matches);

      const TODAY=getToday();
      const now=new Date();
      const isCurrentMonth=viewDate.year===now.getFullYear()&&viewDate.month===now.getMonth();
      const cells=getMonthDays(viewDate.year,viewDate.month);
      const monthLabel=new Date(viewDate.year,viewDate.month,1).toLocaleString("ro-RO",{month:"long",year:"numeric"});

      useEffect(()=>{
        setLoading(true);
        fbRead("checkData").then(data=>{if(data)setCheckData(data);setLoading(false);});
        const iv=setInterval(()=>fbRead("checkData").then(data=>{if(data)setCheckData(data);}),30000);
        return()=>clearInterval(iv);
      },[]);

      const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3500);};

      const handleCheckIn=async(workout)=>{
        if(!activeUser)return;
        const user=CONFIG.users.find(u=>u.id===activeUser);
        const already=checkData[TODAY]?.[activeUser]?.done;
        const newEntry=already?null:{done:true,workout:workout||""};
        const updated={...checkData,[TODAY]:{...(checkData[TODAY]||{}),[activeUser]:newEntry}};
        setCheckData(updated);
        await fbWrite("checkData",updated);
        setShowWorkout(false);setCustomWorkout("");
        if(!already){
          setCelebrating(true);setTimeout(()=>setCelebrating(false),2000);
          const other=CONFIG.users.find(u=>u.id!==activeUser);
          const wt=workout?` (${workout})`:"";
          setSending(true);
          const ok=await sendTelegram(CONFIG.telegram_bot_token,other.telegram_chat_id,`${user.emoji} <b>${user.name}</b> a bifat sportul azi${wt}! 💪\nHai că poți și tu! 🔥`);
          setSending(false);
          showToast(ok?`✅ Sport bifat! ${other.name} a primit notificare.`:"✅ Sport bifat!",ok?"success":"warning");
        } else {showToast("↩️ Zi debifată.");}
      };

      const user=CONFIG.users.find(u=>u.id===activeUser);
      const todayChecked=activeUser?!!checkData[TODAY]?.[activeUser]?.done:false;
      const streak=activeUser?getStreak(checkData,activeUser):0;
      const total=activeUser?getTotal(checkData,activeUser):0;
      const stats=activeUser?getStats(checkData,activeUser):{};

      const bg=isDark?"#0F0F0F":"#F9FAFB";
      const cardBg=isDark?"#1C1C1E":"#fff";
      const textMain=isDark?"#F9FAFB":"#111827";
      const textSub=isDark?"#9CA3AF":"#6B7280";
      const border=isDark?"#2C2C2E":"#E5E7EB";
      const cellEmpty=isDark?"#1C1C1E":"#F3F4F6";
      const cellFuture=isDark?"#0F0F0F":"#F9FAFB";

      return(
        <div style={{minHeight:"100vh",background:bg,fontFamily:"system-ui",paddingBottom:80}}>
          {celebrating&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:200,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
            <div className="dancer">💃</div>
            <div style={{color:"#fff",fontSize:24,fontWeight:700,textAlign:"center"}}>Bravo! 🔥<br/>Sport bifat!</div>
          </div>}

          <header style={{background:cardBg,borderBottom:`1px solid ${border}`,position:"sticky",top:0,zIndex:10}}>
            <div style={{maxWidth:480,margin:"0 auto",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <span style={{fontWeight:700,fontSize:18,color:textMain}}>🏃‍♀️ Fit Buddies {loading&&"⟳"}</span>
              <button onClick={()=>setIsDark(d=>!d)} style={{background:"none",border:`1px solid ${border}`,borderRadius:20,padding:"4px 10px",cursor:"pointer",fontSize:16,color:textMain}}>{isDark?"☀️":"🌙"}</button>
            </div>
          </header>

          <div style={{maxWidth:480,margin:"0 auto",padding:"20px 20px 0"}}>
            <p style={{fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.08em",color:textSub,marginBottom:12}}>Cine ești azi?</p>
            <div style={{display:"flex",gap:12}}>
              {CONFIG.users.map(u=>(
                <button key={u.id} onClick={()=>setActiveUser(u.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6,padding:"16px 12px",borderRadius:16,cursor:"pointer",fontFamily:"inherit",background:activeUser===u.id?u.color:cardBg,color:activeUser===u.id?"#fff":textMain,border:`2px solid ${u.color}`,boxShadow:activeUser===u.id?`0 4px 20px ${u.color}55`:"none"}}>
                  <span style={{fontSize:28}}>{u.emoji}</span>
                  <span style={{fontWeight:600,fontSize:15}}>{u.name}</span>
                  {checkData[TODAY]?.[u.id]?.done&&<span style={{background:"rgba(255,255,255,0.25)",borderRadius:10,padding:"2px 8px",fontSize:11,fontWeight:600}}>✓ azi</span>}
                </button>
              ))}
            </div>
          </div>

          {activeUser&&user&&(
            <div style={{maxWidth:480,margin:"0 auto",padding:"16px 20px 0"}}>
              <div style={{borderRadius:20,padding:20,border:`2px solid ${user.color}`,background:isDark?user.darkColor:user.lightColor,display:"flex",flexDirection:"column",gap:14}}>
                <div style={{display:"flex",alignItems:"center",gap:14}}>
                  <span style={{fontSize:36}}>{user.emoji}</span>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:18,color:textMain}}>{user.name}</div>
                    <div style={{fontSize:13,color:textSub,marginTop:2}}>{streak>0?`🔥 ${streak} zile la rând · `:""}📅 {total} zile total</div>
                    {streak>=3&&<div style={{fontSize:18,marginTop:4}}>{"🔥".repeat(Math.min(streak,7))}</div>}
                  </div>
                </div>
                {todayChecked&&checkData[TODAY]?.[activeUser]?.workout&&(
                  <div style={{background:"rgba(255,255,255,0.15)",borderRadius:10,padding:"8px 12px",fontSize:13,color:textMain}}>💪 {checkData[TODAY][activeUser].workout}</div>
                )}
                {showWorkout&&!todayChecked&&(
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    <p style={{fontSize:12,fontWeight:600,color:textSub,textTransform:"uppercase"}}>Ce antrenament?</p>
                    <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                      {WORKOUTS.map(w=>(
                        <button key={w} onClick={()=>handleCheckIn(w)} style={{padding:"8px 14px",borderRadius:20,border:`1.5px solid ${user.color}`,background:"transparent",color:textMain,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{w}</button>
                      ))}
                    </div>
                    <div style={{display:"flex",gap:8}}>
                      <input value={customWorkout} onChange={e=>setCustomWorkout(e.target.value)} placeholder="Altceva..." style={{flex:1,padding:"8px 12px",borderRadius:20,border:`1.5px solid ${user.color}`,background:isDark?"#2C2C2E":"#fff",color:textMain,fontSize:13,fontFamily:"inherit",outline:"none"}}/>
                      {customWorkout&&<button onClick={()=>handleCheckIn(customWorkout)} style={{padding:"8px 16px",borderRadius:20,background:user.color,border:"none",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>✓</button>}
                    </div>
                    <button onClick={()=>handleCheckIn("")} style={{padding:"8px",background:"transparent",border:"none",color:textSub,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>Sari peste →</button>
                  </div>
                )}
                {!showWorkout&&(
                  <button onClick={()=>{if(todayChecked)handleCheckIn(null);else setShowWorkout(true);}} disabled={sending}
                    style={{width:"100%",padding:"14px 0",borderRadius:14,border:"none",color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer",fontFamily:"inherit",background:todayChecked?"#6B7280":user.color,opacity:sending?0.7:1}}>
                    {sending?"Se trimite...":todayChecked?"✓ Bifat azi — anulează":"✅ Am făcut sport azi!"}
                  </button>
                )}
              </div>
            </div>
          )}

          {activeUser&&Object.keys(stats).length>0&&(
            <div style={{maxWidth:480,margin:"0 auto",padding:"16px 20px 0"}}>
              <p style={{fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.08em",color:textSub,marginBottom:10}}>Statistici</p>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {Object.entries(stats).map(([w,c])=>(
                  <div key={w} style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:"8px 14px",fontSize:13,color:textMain}}>
                    <span style={{fontWeight:700,color:user?.color}}>{c}x</span> {w}
                  </div>
                ))}
              </div>
            </div>
          )}

          <div style={{maxWidth:480,margin:"0 auto",padding:"20px 20px 0"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
              <button onClick={()=>setViewDate(v=>{const d=new Date(v.year,v.month-1,1);return{year:d.getFullYear(),month:d.getMonth()};})} style={{background:"none",border:`1px solid ${border}`,borderRadius:10,padding:"6px 14px",cursor:"pointer",fontSize:20,color:textMain}}>‹</button>
              <span style={{fontSize:14,fontWeight:600,color:textMain,textTransform:"capitalize"}}>{monthLabel}</span>
              <button onClick={()=>{if(isCurrentMonth)return;setViewDate(v=>{const d=new Date(v.year,v.month+1,1);return{year:d.getFullYear(),month:d.getMonth()};});}} style={{background:"none",border:`1px solid ${border}`,borderRadius:10,padding:"6px 14px",cursor:"pointer",fontSize:20,color:textMain,opacity:isCurrentMonth?0.2:1}}>›</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:4}}>
              {DOW.map((d,i)=><div key={i} style={{textAlign:"center",fontSize:11,fontWeight:600,color:textSub,padding:"4px 0"}}>{d}</div>)}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
              {cells.map((cell,i)=>{
                if(!cell)return<div key={`e-${i}`}/>;
                const{day,dateStr,isFuture,isToday}=cell;
                const m=checkData[dateStr]||{};
                const bothDone=CONFIG.users.every(u=>m[u.id]?.done);
                const oneDone=CONFIG.users.some(u=>m[u.id]?.done);
                const bg2=isFuture?cellFuture:oneDone?(bothDone?"linear-gradient(135deg,#C084FC,#FB923C)":m["madalina"]?.done?CONFIG.users[0].color:CONFIG.users[1].color):cellEmpty;
                const col=oneDone&&!isFuture?"#fff":isFuture?"#4B5563":textMain;
                return(
                  <div key={dateStr} onClick={()=>oneDone&&setDayDetail({dateStr,m})}
                    style={{aspectRatio:"1",borderRadius:10,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:bg2,border:isToday?"2px solid #6366F1":"2px solid transparent",color:col,cursor:oneDone?"pointer":"default"}}>
                    <span style={{fontSize:11,fontWeight:600}}>{day}</span>
                    {bothDone&&<span style={{fontSize:8}}>🤝</span>}
                    {oneDone&&!bothDone&&<span style={{fontSize:8}}>{m["madalina"]?.done?CONFIG.users[0].emoji:CONFIG.users[1].emoji}</span>}
                    {isToday&&!oneDone&&<div style={{width:4,height:4,borderRadius:"50%",background:"#6366F1",marginTop:1}}/>}
                  </div>
                );
              })}
            </div>
            <div style={{display:"flex",gap:16,marginTop:12,flexWrap:"wrap"}}>
              {CONFIG.users.map(u=>(
                <div key={u.id} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:textSub}}>
